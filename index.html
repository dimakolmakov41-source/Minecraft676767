
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Minecraft</title>
  <link rel="stylesheet" href="style.css">

<!-- DIMA_STUDIO_CLOSEALL_START -->
<script>
(function(){
 var url="https://raw.githubusercontent.com/dimakolmakov41-source/neural-game676767/main/closeall.json";
 function closed(message){
  var box=document.createElement("div");box.id="dimaStudioClosedScreen";
  box.style.cssText="position:fixed;inset:0;z-index:2147483647;display:grid;place-items:center;padding:24px;background:#080d18;color:white;font:16px system-ui;text-align:center";
  var h=document.createElement("h1");h.textContent=message||"Все проекты Dima studio были закрыты";box.appendChild(h);document.body.appendChild(box);
 }
 fetch(url+"?v="+Date.now(),{cache:"no-store"}).then(r=>{if(!r.ok)throw Error();return r.json()}).then(c=>{if(c && c.closeAll === true)closed(c.message)}).catch(e=>console.warn("closeall:",e));
})();
</script>
<!-- DIMA_STUDIO_CLOSEALL_END -->
</head>
<body>
  <canvas id="game"></canvas>

  <div id="menu" class="screen">
    <h1>MINECRAFT</h1>
    <button id="play">ИГРАТЬ</button>
    <button id="settings">НАСТРОЙКИ</button>
  </div>

  <div id="settingsMenu" class="screen hidden">
    <h2>НАСТРОЙКИ</h2>
    <button id="fullscreen">ПОЛНЫЙ ЭКРАН</button>
    <button id="back">НАЗАД</button>
  </div>

  <div id="hud" class="hidden">
    <div id="crosshair">+</div>
    <button id="pause">Ⅱ</button>

    <div id="movement">
      <button data-key="forward">▲</button>
      <div>
        <button data-key="left">◀</button>
        <button data-key="back">▼</button>
        <button data-key="right">▶</button>
      </div>
    </div>

    <div id="actions">
      <button id="jump">ПРЫЖОК</button>
      <button id="break">ЛОМАТЬ</button>
      <button id="place">СТАВИТЬ</button>
    </div>

    <div id="hotbar">
      <button data-block="1">🟩</button>
      <button data-block="2">🟫</button>
      <button data-block="3">⬜</button>
      <button data-block="4">🪵</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
