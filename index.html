
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Minecraft</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="game"></canvas>

  <div id="menu" class="screen">
    <h1>MINECRAFT</h1>
    <button id="play">ИГРАТЬ</button>
    <button id="settings">НАСТРОЙКИ</button>
  </div>

  <div id="settingsMenu" class="screen hidden">
    <h2>НАСТРОЙКИ</h2>
    <button id="fullscreen">ПОЛНЫЙ ЭКРАН</button>
    <button id="back">НАЗАД</button>
  </div>

  <div id="hud" class="hidden">
    <div id="crosshair">+</div>
    <button id="pause">Ⅱ</button>

    <div id="movement">
      <button data-key="forward">▲</button>
      <div>
        <button data-key="left">◀</button>
        <button data-key="back">▼</button>
        <button data-key="right">▶</button>
      </div>
    </div>

    <div id="actions">
      <button id="jump">ПРЫЖОК</button>
      <button id="break">ЛОМАТЬ</button>
      <button id="place">СТАВИТЬ</button>
    </div>

    <div id="hotbar">
      <button data-block="1">🟩</button>
      <button data-block="2">🟫</button>
      <button data-block="3">⬜</button>
      <button data-block="4">🪵</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
