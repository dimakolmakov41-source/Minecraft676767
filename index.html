
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Minecraft</title>
  <link rel="stylesheet" href="style.css">

<!-- DIMA_STUDIO_CLOSEALL_START -->
<style id="dimaStudioCloseAllGuard">html{visibility:hidden}</style>
<script>
(function(){
  var CONFIG_URL="https://raw.githubusercontent.com/dimakolmakov41-source/neural-game676767/main/closeall.json";
  function reveal(){document.documentElement.style.visibility="visible";}
  function showClosed(message){
    document.body.innerHTML='<main style="min-height:100vh;display:grid;place-items:center;padding:24px;box-sizing:border-box;background:radial-gradient(circle at top,#243b63,#080d18 65%);color:white;font-family:system-ui,Arial;text-align:center"><section style="max-width:620px;padding:34px 26px;border:1px solid #526b91;border-radius:22px;background:#101b2e"><div style="font-size:48px">🔒</div><h1 style="font-size:clamp(22px,5vw,34px)"></h1><p style="color:#a9bbd4">Dima Studio</p></section></main>';
    document.body.querySelector("h1").textContent=message||"Все проекты Dima studio были закрыты";
  }
  document.addEventListener("DOMContentLoaded",function(){
    fetch(CONFIG_URL+"?v="+Date.now(),{cache:"no-store",headers:{"Cache-Control":"no-cache","Pragma":"no-cache"}})
      .then(function(response){if(!response.ok)throw new Error("closeall config unavailable");return response.json();})
      .then(function(config){
        if(config && config.closeAll === true){showClosed(config.message);}
      })
      .catch(function(error){console.warn("Dima Studio closeall check failed:",error);})
      .finally(reveal);
  });
})();
</script>
<!-- DIMA_STUDIO_CLOSEALL_END -->
</head>
<body>
  <canvas id="game"></canvas>

  <div id="menu" class="screen">
    <h1>MINECRAFT</h1>
    <button id="play">ИГРАТЬ</button>
    <button id="settings">НАСТРОЙКИ</button>
  </div>

  <div id="settingsMenu" class="screen hidden">
    <h2>НАСТРОЙКИ</h2>
    <button id="fullscreen">ПОЛНЫЙ ЭКРАН</button>
    <button id="back">НАЗАД</button>
  </div>

  <div id="hud" class="hidden">
    <div id="crosshair">+</div>
    <button id="pause">Ⅱ</button>

    <div id="movement">
      <button data-key="forward">▲</button>
      <div>
        <button data-key="left">◀</button>
        <button data-key="back">▼</button>
        <button data-key="right">▶</button>
      </div>
    </div>

    <div id="actions">
      <button id="jump">ПРЫЖОК</button>
      <button id="break">ЛОМАТЬ</button>
      <button id="place">СТАВИТЬ</button>
    </div>

    <div id="hotbar">
      <button data-block="1">🟩</button>
      <button data-block="2">🟫</button>
      <button data-block="3">⬜</button>
      <button data-block="4">🪵</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
