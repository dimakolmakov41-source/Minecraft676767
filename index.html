
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Minecraft</title>
  <link rel="stylesheet" href="style.css">

<!-- DIMA_STUDIO_CLOSEALL_START -->
<style id="dimaStudioCloseAllGuard">html{visibility:hidden}</style>
<script>
(function(){
  var CONFIG_URL="https://raw.githubusercontent.com/dimakolmakov41-source/neural-game676767/main/closeall.json";
  function showPage(){document.documentElement.style.visibility="visible";}
  function showClosed(message){
    document.body.innerHTML=""
      +'<main style="min-height:100vh;display:flex;align-items:center;justify-content:center;box-sizing:border-box;padding:24px;background:radial-gradient(circle at top,#243b63,#080d18 65%);color:#fff;font-family:system-ui,Arial;text-align:center">'
      +'<section style="max-width:620px;padding:34px 26px;border:1px solid #526b91;border-radius:22px;background:#101b2e;box-shadow:0 20px 70px #0008">'
      +'<div style="font-size:48px;margin-bottom:16px">🔒</div>'
      +'<h1 style="font-size:clamp(22px,5vw,34px);margin:0;line-height:1.35"></h1>'
      +'<p style="color:#a9bbd4;margin:16px 0 0">Dima Studio</p>'
      +'</section></main>';
    document.body.querySelector("h1").textContent=message||"Все проекты Dima studio были закрыты";
  }
  document.addEventListener("DOMContentLoaded",function(){
    fetch(CONFIG_URL,{cache:"no-store"})
      .then(function(response){if(!response.ok)throw new Error("closeall config unavailable");return response.json();})
      .then(function(config){if(config&&config.closeAll===true){showClosed(config.message);}})
      .catch(function(){})
      .finally(showPage);
  });
})();
</script>
<!-- DIMA_STUDIO_CLOSEALL_END -->
</head>
<body>
  <canvas id="game"></canvas>

  <div id="menu" class="screen">
    <h1>MINECRAFT</h1>
    <button id="play">ИГРАТЬ</button>
    <button id="settings">НАСТРОЙКИ</button>
  </div>

  <div id="settingsMenu" class="screen hidden">
    <h2>НАСТРОЙКИ</h2>
    <button id="fullscreen">ПОЛНЫЙ ЭКРАН</button>
    <button id="back">НАЗАД</button>
  </div>

  <div id="hud" class="hidden">
    <div id="crosshair">+</div>
    <button id="pause">Ⅱ</button>

    <div id="movement">
      <button data-key="forward">▲</button>
      <div>
        <button data-key="left">◀</button>
        <button data-key="back">▼</button>
        <button data-key="right">▶</button>
      </div>
    </div>

    <div id="actions">
      <button id="jump">ПРЫЖОК</button>
      <button id="break">ЛОМАТЬ</button>
      <button id="place">СТАВИТЬ</button>
    </div>

    <div id="hotbar">
      <button data-block="1">🟩</button>
      <button data-block="2">🟫</button>
      <button data-block="3">⬜</button>
      <button data-block="4">🪵</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
